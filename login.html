<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | Tu Norte</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="plataforma.html" class="brand"><img src="assets/logo-tu-norte.webp" alt="Peleas de Gallos Tu Norte" class="brand-logo-img"></a>
    <h1>Bienvenido de vuelta</h1>
    <p class="sub">Inicia sesión para apostar y administrar tu billetera.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-brass btn-block">Iniciar sesión</button>
    </form>

    <div class="auth-foot">
      Acceso demo: <strong style="color:var(--ink);">cliente@demo.com</strong> / <strong style="color:var(--ink);">123456</strong>
    </div>
  </div>
</div>

<script src="app.js?v=3"></script>
<script>
document.getElementById('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;

  if(email !== 'cliente@demo.com' || password !== '123456'){
    showToast('Correo o contraseña incorrectos');
    return;
  }

  login();
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  window.location.href = next && next !== 'login.html' ? next : 'plataforma.html';
});
</script>

</body>
</html>
