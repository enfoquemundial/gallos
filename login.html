<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | Tu Norte</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand"><img src="assets/logo-tu-norte.webp" alt="Peleas de Gallos Tu Norte" class="brand-logo-img"></a>
    <h1>Bienvenido de vuelta</h1>
    <p class="sub">Inicia sesión para apostar y administrar tu billetera.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input autocomplete="email" type="email" id="email" aria-describedby="login-error" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input minlength="6" autocomplete="current-password" type="password" id="password" aria-describedby="login-error" placeholder="••••••••" required>
      </div>
      <p id="login-error" role="alert" aria-live="polite" style="color:#ff6b76;font-size:14px;line-height:1.4;margin:0 0 12px;"></p>
      <button type="submit" class="btn btn-brass btn-block">Iniciar sesión</button>
    </form>
<p id="auth-status" role="status" aria-live="polite" style="min-height:1.5em;margin-top:16px;"></p>
<button type="button" data-google class="btn btn-outline btn-block" style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:12px;"><img src="https://developers.google.com/static/identity/images/g-logo.png" alt="" aria-hidden="true" width="24" height="24" style="flex-shrink:0;object-fit:contain;"><span>Continuar con Google</span></button>

    <div class="auth-foot">
      <button id="reset-password" type="button" class="btn btn-outline">¿Olvidaste tu contraseña?</button><br><br>¿No tienes cuenta? <a href="registro.html">Crear cuenta</a>
    </div>
  </div>
</div>

<script src="app.js?v=4"></script>
<script src="firebase-config.js"></script>
<script src="auth.js?v=6"></script>

</body>
</html>
