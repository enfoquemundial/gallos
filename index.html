<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Tu Norte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-mockup {
            width: 100%;
            max-width: 420px;
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Image Container */
        .top-image-container {
            position: relative;
            width: 100%;
            background-color: #f0f0f0;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            overflow: hidden;
        }

        .top-image {
            width:100%;
            display:block;
            height:auto;
            aspect-ratio:1.617 / 1;
            object-fit:cover;
            object-position:center;
        }

        .back-button {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .search-icon-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background-color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        /* Action Row (Buttons) */
        .action-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 16px 16px 10px 16px;
            gap: 10px;
        }

        .left-actions {
            display: flex;
            align-items: center;
            justify-self: start;
        }

        .btn-action-text {
            background: #e60023; /* fallback for red, or transparent if plain button */
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-hoy {
            background: #e60023;
            color: white;
        }

        .btn-apostar {
            justify-self: center;
            background: #1a1a1a;
            color: #fff;
            padding: 13px 32px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 0.6px;
            border: 1.5px solid #ff2d46;
            cursor: pointer;
            box-shadow: 0 0 4px 0.5px rgba(255, 45, 70, 0.55);
            animation: apostar-glow 1.8s ease-in-out infinite;
        }

        @keyframes apostar-glow {
            0%, 100% {
                box-shadow: 0 0 3px 0px rgba(255, 45, 70, 0.4);
                border-color: #ff2d46;
            }
            50% {
                box-shadow: 0 0 9px 1.5px rgba(255, 45, 70, 0.9);
                border-color: #ff5468;
            }
        }

        .btn-promo {
            justify-self: end;
            background: #e60023;
            color: white;
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }

        /* User Info Row */
        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 16px 12px 16px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .caption-row {
            padding: 0 16px 16px 16px;
            font-size: 15px;
            color: #fff;
        }

        .caption-row span {
            color: #adadad;
            font-weight: 600;
        }

        /* Grid Feed */
        .feed-grid {
            columns: 2;
            column-gap: 10px;
            padding: 0 10px 20px 10px;
        }

        .feed-card {
            background-color: #121212;
            border-radius: 16px;
            overflow: hidden;
            display: block;
            position: relative;
            break-inside: avoid;
            margin-bottom: 10px;
        }

        .card-image-wrap {
            position: relative;
            width: 100%;
        }

        .card-image {
            width: 100%;
            height: 220px;
            display: block;
            border-radius: 16px;
            object-fit: cover;
        }

        .feed-card.short .card-image {
            height: 160px;
        }

        .feed-card.tall .card-image {
            height: 280px;
        }

        .card-more-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Custom Config / Overlay Buttons requested */
        .btn-overlay-mejor-gallero {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-overlay-custom-mid {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-overlay-custom-right {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* Invite Banner Card */
        .invite-card {
            background-color: #f3e5e8;
            color: #000;
            border-radius: 16px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .invite-card h3 {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3;
        }

        /* ===== CHROME ESCRITORIO (estilo Pinterest) ===== */
        .pin-sidebar, .pin-topbar, .pin-tabs { display: none; }

        @media (min-width: 768px) {
            body {
                background: #fff;
                color: #111;
                display: block;
                align-items: initial;
                justify-content: initial;
            }

            /* Oculta la parte "movil" */
            .top-image-container,
            .user-row,
            .caption-row { display: none !important; }

            /* Barra lateral izquierda */
            .pin-sidebar {
                display: flex;
                position: fixed;
                top: 0; left: 0; bottom: 0;
                width: 72px;
                background: #fff;
                flex-direction: column;
                align-items: center;
                padding: 14px 0;
                z-index: 50;
                gap: 6px;
            }
            .pin-sidebar .pin-logo {
                width: 40px; height: 40px;
                border-radius: 50%;
                background: #e60023;
                color: #fff;
                display: flex; align-items: center; justify-content: center;
                font-size: 20px;
                margin-bottom: 14px;
            }
            .pin-sidebar .side-btn {
                width: 48px; height: 48px;
                border-radius: 14px;
                display: flex; align-items: center; justify-content: center;
                color: #111;
                font-size: 20px;
                cursor: pointer;
                background: transparent;
                border: none;
                position: relative;
            }
            .pin-sidebar .side-btn:hover { background: #f0f0f0; }
            .pin-sidebar .side-btn.active { background: #111; color: #fff; }
            .pin-sidebar .side-spacer { flex: 1; }

            /* Barra superior */
            .pin-topbar {
                display: flex;
                position: fixed;
                top: 0; left: 72px; right: 0;
                height: 72px;
                background: #fff;
                align-items: center;
                gap: 12px;
                padding: 0 20px;
                z-index: 45;
            }
            .pin-search {
                flex: 1;
                display: flex;
                align-items: center;
                gap: 12px;
                background: #e9e9e7;
                border-radius: 999px;
                padding: 0 18px;
                height: 48px;
                color: #5f5f5f;
                font-size: 16px;
            }
            .pin-search input {
                flex: 1;
                border: none;
                background: transparent;
                outline: none;
                font-size: 16px;
                color: #111;
            }
            .pin-avatar {
                width: 34px; height: 34px;
                border-radius: 50%;
                background: #c5e8d5;
                color: #2f6f4f;
                display: flex; align-items: center; justify-content: center;
                font-weight: 700;
                font-size: 15px;
                flex: 0 0 auto;
            }
            .pin-topbar .chev { color: #5f5f5f; font-size: 14px; }

            /* Pestana "Todos" */
            .pin-tabs {
                padding: 8px 24px 4px 24px;
                display: flex;
                gap: 24px;
                font-size: 15px;
                font-weight: 600;
            }
            .pin-tabs span {
                padding-bottom: 8px;
                border-bottom: 3px solid #111;
                color: #111;
            }

            /* Contenedor principal */
            .phone-mockup {
                width: auto;
                max-width: none;
                background: #fff;
                min-height: 100vh;
                margin-left: 0;
                padding-top: 0;
            }

            /* Rejilla tipo mosaico */
            .feed-grid {
                columns: 5;
                column-gap: 16px;
                padding: 8px 24px 40px 24px;
            }
            .feed-card {
                background: transparent;
                margin-bottom: 16px;
                border-radius: 16px;
            }
            .card-image { height: 300px; border-radius: 16px; }
            .feed-card.short .card-image { height: 220px; }
            .feed-card.tall .card-image { height: 400px; }
            .card-more-btn { background: rgba(0,0,0,0.45); }
        }
        @media (min-width: 1200px) { .feed-grid { columns: 7; } }
        @media (min-width: 1700px) { .feed-grid { columns: 8; } }
            @media (max-width: 767px) {
            html, body { width:100%; min-width:0; overflow-x:hidden; }
            body { display:block; margin:0; }
            .phone-mockup { width:100%; max-width:none; min-width:0; margin:0; }
            .action-row { grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr); gap:8px; padding:16px 12px 10px; }
            .action-row > *, .left-actions { min-width:0; }
            .btn-action-text, .btn-promo { padding:10px 12px; font-size:14px; }
            .btn-apostar { width:100%; padding:12px 6px; font-size:14px; letter-spacing:0; white-space:nowrap; }
            .top-image-container, .top-image, .feed-grid { max-width:100%; }
        }
    
        /* Botones principales de la portada */
        .action-row {
            width:100%; max-width:720px; margin:0 auto;
            grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);
            align-items:center; gap:10px; padding:0 12px 18px;
        }
        .left-actions { width:100%; min-width:0; }
        .action-row .btn-hoy, .action-row .btn-apostar, .action-row .btn-promo {
            width:100%; min-width:0; height:92px; min-height:92px;
            display:flex; align-items:center; justify-content:center;
            border-radius:999px; padding:12px 6px;
            font-size:clamp(17px,5vw,28px); line-height:1.1; font-weight:800;
            letter-spacing:0; white-space:nowrap;
            color:#fff; border:2px solid #f33b49;
        }
        .action-row .btn-hoy, .action-row .btn-promo {
            height:48px; min-height:48px; padding:7px 8px;
            font-size:clamp(10px,2.8vw,12px); font-weight:700;
            background:#1a1a1a; border-color:#ff4a5c;
            text-shadow:0 0 8px rgba(255,255,255,.25);
            box-shadow:0 0 5px #ff4055,0 0 16px rgba(255,45,70,.7),inset 0 0 7px rgba(255,45,70,.25);
            animation:portada-neon 2.4s ease-in-out infinite;
        }
        .action-row .btn-apostar {
            font-size:clamp(20px,6vw,32px);
            background:#1a1a1a; border-color:#ff4a5c;
            text-shadow:0 0 8px rgba(255,255,255,.25);
            box-shadow:0 0 5px #ff4055,0 0 16px rgba(255,45,70,.7),inset 0 0 7px rgba(255,45,70,.25);
            animation:portada-neon 2.4s ease-in-out infinite;
        }
        @keyframes portada-neon {
            0%,100% {box-shadow:0 0 5px #ff4055,0 0 14px rgba(255,45,70,.65),inset 0 0 7px rgba(255,45,70,.22);}
            50% {box-shadow:0 0 8px #ff6373,0 0 23px rgba(255,45,70,.85),inset 0 0 10px rgba(255,45,70,.3);}
        }
        @media(prefers-reduced-motion:reduce){.action-row .btn-apostar,.action-row .btn-hoy,.action-row .btn-promo{animation:none;}}
    
/* Portada: acción principal y categorías destacadas */
.action-row .btn-hoy,.action-row .btn-promo{animation:none;box-shadow:0 0 5px #e43851,0 0 10px rgba(255,45,70,.35),inset 0 0 7px rgba(255,45,70,.15)}
.action-row .btn-apostar{position:relative;isolation:isolate;overflow:hidden;border:2px solid #ffb0b9;background:linear-gradient(150deg,#45202a,#21151d 45%,#371820);text-shadow:0 0 12px #fff8,0 0 24px #ff557a;animation:apostar-beacon 2.8s ease-in-out infinite}
.action-row .btn-apostar::after{content:"";position:absolute;inset:-60% -25%;z-index:-1;background:linear-gradient(105deg,transparent 38%,#ffffff38 48%,#ffffff85 50%,transparent 62%);transform:translateX(-100%);animation:apostar-sweep 4.8s ease-in-out infinite;pointer-events:none}
.action-row .btn-apostar:hover{filter:brightness(1.14)}
@keyframes apostar-beacon{0%,100%{box-shadow:0 0 6px #ff9aa9,0 0 22px #ff3359bb,0 0 40px #ff204740,inset 0 0 16px #ff46633d}50%{box-shadow:0 0 10px #ffc2cb,0 0 30px #ff3359ee,0 0 52px #ff204766,inset 0 0 24px #ff466366}}
@keyframes apostar-sweep{0%,45%{transform:translateX(-100%)}80%,100%{transform:translateX(100%)}}
.featured-pair{column-span:all;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
.featured-pair .feed-card{margin:0;background:#121212}
.featured-pair .card-image{height:clamp(225px,38vw,390px);border-radius:16px}
.feature-label{position:absolute;top:12px;left:10px;right:10px;z-index:2;display:flex;align-items:center;gap:9px;width:fit-content;max-width:calc(100% - 20px);padding:10px 12px;border:1px solid #ffffff4d;border-radius:14px;background:linear-gradient(135deg,#11151be8,#20242acf);backdrop-filter:blur(12px);color:#fff;box-shadow:0 6px 22px #0005;pointer-events:none;font-size:clamp(10px,2.5vw,13px);line-height:1.25;letter-spacing:.15px}
.feature-label strong{font-size:clamp(15px,3.6vw,21px);font-weight:800}
.feature-mark{display:grid;place-items:center;width:27px;height:27px;flex-shrink:0;border-radius:9px;background:#ff385724;color:#ff8295;font-size:15px;border:1px solid #ff637650}
@media(min-width:768px){.featured-pair{max-width:900px;margin:0 auto 24px;gap:18px}.featured-pair .card-image{height:370px}}
@media(prefers-reduced-motion:reduce){.action-row .btn-apostar,.action-row .btn-apostar::after{animation:none}}
</style>
</head>
