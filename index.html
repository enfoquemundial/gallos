<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Interface Replica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-mockup {
            width: 100%;
            max-width: 420px;
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Image Container */
        .top-image-container {
            position: relative;
            width: 100%;
            background-color: #f0f0f0;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            overflow: hidden;
        }

        .top-image {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .back-button {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .search-icon-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background-color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        /* Action Row (Buttons) */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 8px 16px;
        }

        .left-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-action-text {
            background: #e60023; /* fallback for red, or transparent if plain button */
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-hoy {
            background: #e60023;
            color: white;
        }

        .btn-apostar {
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }

        .btn-promo {
            background: #e60023;
            color: white;
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }

        /* User Info Row */
        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 16px 12px 16px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .caption-row {
            padding: 0 16px 16px 16px;
            font-size: 15px;
            color: #fff;
        }

        .caption-row span {
            color: #adadad;
            font-weight: 600;
        }

        /* Grid Feed */
        .feed-grid {
            columns: 2;
            column-gap: 10px;
            padding: 0 10px 20px 10px;
        }

        .feed-card {
            background-color: #121212;
            border-radius: 16px;
            overflow: hidden;
            display: block;
            position: relative;
            break-inside: avoid;
            margin-bottom: 10px;
        }

        .card-image-wrap {
            position: relative;
            width: 100%;
        }

        .card-image {
            width: 100%;
            height: 220px;
            display: block;
            border-radius: 16px;
            object-fit: cover;
        }

        .feed-card.short .card-image {
            height: 160px;
        }

        .feed-card.tall .card-image {
            height: 280px;
        }

        .card-more-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Custom Config / Overlay Buttons requested */
        .btn-overlay-mejor-gallero {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-overlay-custom-mid {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-overlay-custom-right {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* Invite Banner Card */
        .invite-card {
            background-color: #f3e5e8;
            color: #000;
            border-radius: 16px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .invite-card h3 {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3;
        }
    </style>
</head>
