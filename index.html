<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest Interface Replica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-mockup {
            width: 100%;
            max-width: 420px;
            background-color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Image Container */
        .top-image-container {
            position: relative;
            width: 100%;
            background-color: #f0f0f0;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            overflow: hidden;
        }

        .top-image {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .back-button {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .search-icon-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background-color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        /* Action Row (Buttons) */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 8px 16px;
        }

        .left-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-action-text {
            background: #e60023; /* fallback for red, or transparent if plain button */
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            padding: 10px 18px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-hoy {
            background: #e60023;
            color: white;
        }

        .btn-apostar {
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }

        .btn-promo {
            background: #e60023;
            color: white;
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }

        /* User Info Row */
        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 16px 12px 16px;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .caption-row {
            padding: 0 16px 16px 16px;
            font-size: 15px;
            color: #fff;
        }

        .caption-row span {
            color: #adadad;
            font-weight: 600;
        }

        /* Grid Feed */
        .feed-grid {
            columns: 2;
            column-gap: 10px;
            padding: 0 10px 20px 10px;
        }

        .feed-card {
            background-color: #121212;
            border-radius: 16px;
            overflow: hidden;
            display: block;
            position: relative;
            break-inside: avoid;
            margin-bottom: 10px;
        }

        .card-image-wrap {
            position: relative;
            width: 100%;
        }

        .card-image {
            width: 100%;
            height: 220px;
            display: block;
            border-radius: 16px;
            object-fit: cover;
        }

        .feed-card.short .card-image {
            height: 160px;
        }

        .feed-card.tall .card-image {
            height: 280px;
        }

        .card-more-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Custom Config / Overlay Buttons requested */
        .btn-overlay-mejor-gallero {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-overlay-custom-mid {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-overlay-custom-right {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* Invite Banner Card */
        .invite-card {
            background-color: #f3e5e8;
            color: #000;
            border-radius: 16px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .invite-card h3 {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="phone-mockup">
        <!-- Top Image Card -->
        <div class="top-image-container">
            <div class="back-button">
                <i class="fa-solid fa-chevron-left"></i>
            </div>
            <img src="peleas-de-gallos-header.png" class="top-image" alt="Peleas de Gallos Tu Norte">
            <div class="search-icon-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <!-- Middle Interaction Row (Red circles from image) -->
        <div class="action-row">
            <div class="left-actions">
                <!-- Botón de la izquierda: HOY -->
                <button class="btn-action-text btn-hoy">
                    Hoy
                </button>
                
                <!-- Botón del medio: APOSTAR -->
                <button class="btn-apostar">
                    Apostar
                </button>
            </div>

            <!-- Botón de la derecha: PROMO -->
            <button class="btn-promo">
                Promo
            </button>
        </div>

        <!-- User Information -->
        <div class="user-row">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=100&auto=format&fit=crop" class="user-avatar" alt="Avatar">
            <span class="user-name">Esfrailin Quezada</span>
        </div>

        <div class="caption-row">
            "Son tatuajes o figuras" ... <span>View comment</span>
        </div>

        <!-- Feed Grid Section (Bottom red circles from image) -->
        <div class="feed-grid">
            <!-- Left Grid Item -->
            <div class="feed-card">
                <div class="card-image-wrap">
                    <!-- Botón abajo a la izquierda: MEJOR GALLERO -->
                    <button class="btn-overlay-mejor-gallero">Mejor gallero</button>
                    
                    <!-- Botón en el medio abajo: Sin nombre (para configurar) -->
                    <button class="btn-overlay-custom-mid" title="Configuración"><i class="fa-solid fa-plus"></i></button>

                    <img src="https://images.unsplash.com/photo-1545251765-6aad90d25972?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo blanco de pelea">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <!-- Right Grid Item -->
            <div class="feed-card">
                <div class="card-image-wrap">
                    <!-- Botón a la derecha abajo: Sin nombre (para configurar) -->
                    <button class="btn-overlay-custom-right" title="Configuración"><i class="fa-solid fa-plus"></i></button>

                    <img src="https://images.unsplash.com/photo-1583510383754-35fc1d1eb598?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo de pelea rojo en primer plano">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <!-- Reemplazo del banner de texto por imagen de gallo -->
            <div class="feed-card tall">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1554740760-5db7aca3ec66?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo negro y amarillo">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card short">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1588164950715-6aa49568dd80?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Cabeza de gallo amarillo y rojo">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1605490552919-bb0a239812c1?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo rojo negro y marrón">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card tall">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1672620003939-f82a45cb5adc?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo marrón y blanco">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card short">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1706456134122-a0702ce76de7?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo de pie sobre hierba">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1689697373821-b1b201830e84?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo sobre mesa de madera">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card tall">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1623662795461-4d282ec436a2?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo negro y marrón sobre piso de concreto">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card short">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1656744638362-3d2672eaac01?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo sobre plataforma de madera">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1579088092239-0f893322cfdc?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo marrón blanco y negro sobre pasto">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card tall">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1643299812896-431b89343951?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo caminando sobre hierba">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>

            <div class="feed-card short">
                <div class="card-image-wrap">
                    <img src="https://images.unsplash.com/photo-1715689236234-13773aca8e8b?q=80&w=400&auto=format&fit=crop" class="card-image" alt="Gallo con cabeza roja y cola azul">
                    <span class="card-more-btn"><i class="fa-solid fa-ellipsis"></i></span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
