<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta | Tu Norte</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card" style="max-width:440px;">
    <a href="index.html" class="brand"><img src="assets/logo-tu-norte.webp" alt="Peleas de Gallos Tu Norte" class="brand-logo-img"></a>
    <h1>Crea tu cuenta</h1>
    <p class="sub">Regístrate con tu correo o continúa con Google.</p>

    <form id="signup-form">
      <div class="field">
        <label for="fullname">Nombre completo</label>
        <input type="text" id="fullname" placeholder="Tu nombre" required>
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input autocomplete="email" type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input minlength="6" autocomplete="new-password" type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="check-row">
        <input type="checkbox" id="age-confirm" required>
        <label for="age-confirm">Confirmo que soy mayor de 18 años y que la información proporcionada es correcta.</label>
      </div>
      <div class="check-row">
        <input type="checkbox" id="terms-confirm" required>
        <label for="terms-confirm">Acepto los Términos y Condiciones y la Política de Juego Responsable.</label>
      </div>

      <button type="submit" class="btn btn-brass btn-block">Crear cuenta</button>
    </form>
<p id="auth-status" role="status" aria-live="polite" style="min-height:1.5em;margin-top:16px;"></p>
<button type="button" data-google class="btn btn-outline btn-block" style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:12px;"><img src="https://developers.google.com/static/identity/images/g-logo.png" alt="" aria-hidden="true" width="24" height="24" style="flex-shrink:0;object-fit:contain;"><span>Continuar con Google</span></button>

    <div class="auth-foot">
      ¿Ya tienes cuenta? <a href="login.html" style="color:var(--gold);">Inicia sesión</a>
    </div>
  </div>
</div>

<script src="app.js?v=4"></script>
<script src="firebase-config.js"></script>
<script src="auth.js?v=5"></script>

</body>
</html>
